name: Bug Report
description: Report a reproducible problem
title: "bug: <short-bug-title>"
labels:
  - bug
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Tell us what went wrong and include an error message when available.
      placeholder: What is broken?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the exact steps needed to reproduce the problem.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
      description: Describe the expected result.
    validations:
      required: true

  - type: input
    id: error-page-url
    attributes:
      label: Error page URL
      description: Paste the browser URL where the error occurred.
      placeholder: https://example.com/path
    validations:
      required: true

  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Drag and drop or paste a screenshot of the error.
    validations:
      required: true
