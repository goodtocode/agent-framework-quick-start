name: Feature Request
description: Suggest an improvement
title: "feat: <short-feature-title>"
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        A clear problem and a small proposed change are enough to start a useful discussion.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the user need, limitation, or friction.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: Describe a possible solution or the outcome you expect.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples, alternatives, links, screenshots, or implementation ideas.
    validations:
      required: false
